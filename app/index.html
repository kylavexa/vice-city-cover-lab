<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Vice City Cover Lab — turn a photo and a caption into multi-panel GTA-style poster art, offline, in your browser.">
<title>Vice City Cover Lab</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<noscript><p style="padding: 1rem">Vice City Cover Lab needs JavaScript to draw your cover.</p></noscript>
<main class="app">
  <section class="controls" aria-label="Cover controls">
    <h1>Vice City Cover Lab</h1>
    <p class="tagline">A photo and a caption, made into GTA-style cover art.</p>

    <h2>Photos</h2>
    <div id="slots" class="slots"></div>

    <h2>Selected panel</h2>
    <div class="row">
      <label>Shows
        <select id="panel-photo">
          <option value="0">Photo 1</option>
          <option value="1">Photo 2</option>
          <option value="2">Photo 3</option>
        </select>
      </label>
      <label>Zoom
        <input id="zoom" type="range" min="1" max="4" step="0.05" value="1">
      </label>
      <button id="zoom-reset" type="button">Reset crop</button>
    </div>
    <p class="hint">Click a panel to pick it, drag to pan its photo, scroll to zoom.</p>

    <h2>Layout</h2>
    <div id="layout-pick" class="pick"></div>

    <h2>Colour grade</h2>
    <div id="grade-pick" class="pick grades"></div>

    <h2>Words</h2>
    <label>Caption <input id="caption" type="text" maxlength="40" value="Sunset Heist"></label>
    <label>Kicker <input id="kicker" type="text" maxlength="40" value="A Vice City Story"></label>

    <h2>Export size</h2>
    <div id="size-pick" class="pick"></div>
    <div class="row">
      <button id="export" type="button" class="primary">Export PNG</button>
      <button id="export-all" type="button">Export all 3</button>
    </div>
    <div class="row">
      <button id="undo" type="button">Undo</button>
      <button id="redo" type="button">Redo</button>
    </div>
    <p id="status" role="status"></p>
  </section>
  <section class="stage">
    <canvas id="cover" width="1080" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
